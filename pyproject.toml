[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "willia"
version = "0.0.1"
description = "One endless chat, single profile."
requires-python = ">=3.11"
dependencies = ["ddgs"]

[project.scripts]
willia = "willia.cli:main"

[tool.setuptools]
packages = ["willia"]

[tool.setuptools.package-data]
willia = ["*.md"]
